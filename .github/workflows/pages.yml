name: 发布 GitHub Pages

# 网站从 gh-pages 分支发布（仓库 Settings → Pages 的来源为 gh-pages 分支）。
# 每次 web/ 变化时打包离线依赖并更新 gh-pages 分支。
on:
  push:
    branches: ["ccr-7976ba6a-3lfhxt"]   # 仓库默认分支
    paths: ["web/**", "scripts/**", "package*.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署网页版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: 打包离线依赖（Pyodide、CodeMirror、Blockly 等）
        run: npm run vendor
      - run: touch web/.nojekyll
      - name: 更新 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 部署网页版
