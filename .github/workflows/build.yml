name: 构建与测试

on:
  push:
    branches: ["**"]        # 只针对分支；打标签发布时由 release.yml 调用
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: 测试（Python 核心 + 端到端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run vendor
      - run: npm test
      - name: 安装 Playwright 浏览器
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 打包离线网页版
        run: cd web && zip -qr ../python-nexus-web.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: python-nexus-web
          path: python-nexus-web.zip

  rust:
    name: Rust 外壳（cargo test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows 安装包（EXE / MSI）
    needs: [test, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run vendor
      - name: 打包嵌入式 CPython
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-python-embed.ps1
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: python-nexus-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android 安装包（APK）
    needs: [test, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub 托管的 Ubuntu 运行器已预装 Android SDK 与 NDK（ANDROID_HOME / ANDROID_NDK_LATEST_HOME）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: npm ci
      - run: npm run vendor
      - name: 构建 APK（WebView + Pyodide 离线运行时）
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          npx tauri android build --apk --target aarch64 --target armv7 --ci
      - name: 签名 APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            # 正式签名：仓库 Secrets 中配置的密钥库（后续版本可覆盖安装）
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-nexus}"
          else
            # 未配置密钥时生成临时密钥签名：可以安装，但不同版本之间不能覆盖升级
            PASS=$(openssl rand -hex 16); ALIAS=nexus
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Python Nexus"
          fi
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "未签名 APK：$UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out PythonNexus-android.apk aligned.apk
          "$BT/apksigner" verify --print-certs PythonNexus-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: python-nexus-android
          path: PythonNexus-android.apk
