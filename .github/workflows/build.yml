name: 构建与测试

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python 核心 + 端到端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run vendor
      - run: npm test
      - name: 安装 Playwright 浏览器
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    name: Rust 外壳（cargo test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows 安装包（EXE / MSI）
    needs: [test, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run vendor
      - name: 打包嵌入式 CPython
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-python-embed.ps1
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: python-nexus-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android 安装包（APK）
    needs: [test, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: npm ci
      - run: npm run vendor
      - name: 构建 APK（WebView + Pyodide 离线运行时）
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          npx tauri android init
          npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: python-nexus-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
