[package]
name = "python-nexus"
version = "0.2.0"
description = "Python Nexus — 全平台离线 Python 学习与开发系统"
edition = "2021"
rust-version = "1.77"

[lib]
name = "python_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
